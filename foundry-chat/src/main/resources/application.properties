# Porta do servidor Spring Boot
server.port=8080

# =======================================================
# Configurações do Microsoft Foundry (Azure AI Foundry)
# =======================================================
# Os valores abaixo podem ser definidos por variáveis de ambiente
# ou diretamente neste arquivo para testes locais.
#
# Exemplo de Endpoint: https://<seu-projeto-ou-recurso>.openai.azure.com/
# Exemplo de Agent ID: asst_xxxxxxxxxxxxxxxxxxxxxxxx
#
foundry.endpoint=${FOUNDRY_ENDPOINT:}
foundry.api-key=${FOUNDRY_API_KEY:}
foundry.agent-id=${FOUNDRY_AGENT_ID:}
foundry.api-version=${FOUNDRY_API_VERSION:2024-05-01-preview}
